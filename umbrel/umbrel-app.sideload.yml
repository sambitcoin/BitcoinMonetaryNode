releaseNotes: >-
  First alpha.


  Four code reviews happened before this release and all four found real
  bugs. The ones that changed published figures:


  Contract witness data was being destroyed. The inscription detector matched
  the shape of an envelope — a push, then OP_IF, then data — which is also
  the shape of a Lightning HTLC. Those transactions lost their entire
  witness. 14.5 GB counted as "spam removed" was signatures, about 28% of the
  published figure. Detection now requires the ordinals protocol tag, with
  regression tests built from real BOLT 3 scripts.


  Oversized scriptSig was counted as removed and then copied into the store
  verbatim. A saving that never happened. It is now actually removed.


  The retention policy and the published policy identifier came from
  different code, so the identifier described rules that had never run. They
  are now one source, and a store records the policy that built it.


  Commitments were computed over the block hash a record claimed rather than
  the one recomputed from its header.
